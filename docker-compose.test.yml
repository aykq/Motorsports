services:
  db_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: motorsports_test
      POSTGRES_USER: ms_test_user
      POSTGRES_PASSWORD: ms_test_password
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_test_user -d motorsports_test"]
      interval: 5s
      timeout: 5s
      retries: 5
